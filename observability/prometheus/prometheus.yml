# Local-only Prometheus config. Both actuators require X-API-Key (ADR-07), so the scraper sends the demo defaults.
# If TRIAGE_API_KEY or ASSISTANT_API_KEY is overridden in .env, update the secrets below to match.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Platform alerts (NFR-07). Local only: they appear on the Prometheus Alerts page and notify nobody.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: triage-service
    metrics_path: /actuator/prometheus
    http_headers:
      X-API-Key:
        secrets: [test-triage-key]
    static_configs:
      - targets: ["triage-service:8080"]

  - job_name: clinical-assistant-service
    metrics_path: /actuator/prometheus
    http_headers:
      X-API-Key:
        secrets: [test-assistant-key]
    static_configs:
      - targets: ["clinical-assistant-service:8080"]
