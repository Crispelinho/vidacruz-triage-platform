# Only runtime values change. The workloads, probes, security contexts and limits stay in the base manifests.
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-service-config
data:
  R2DBC_URL: r2dbc:postgresql://local-db:5432/triage
  # Short SLA windows keep the local escalation and SSE check under two minutes.
  SLA_CRITICO_MINUTES: "1"
  SLA_URGENTE_MINUTES: "1"
  SLA_URGENTE_2_MINUTES: "2"
  SLA_NO_URGENTE_MINUTES: "5"
  SLA_NO_URGENTE_2_MINUTES: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinical-assistant-service-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://local-db:5432/assistant
