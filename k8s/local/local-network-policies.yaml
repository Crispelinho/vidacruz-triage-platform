# M-6, local overlay: the in-cluster PostgreSQL and Jaeger replace Azure PostgreSQL and the cloud tracing backend, so
# they need their own allow rules on top of infra/k8s/network-policies.yaml. ipBlock rules do not reliably match pod
# addresses, hence the explicit pod selectors. Docker Desktop's default CNI does not enforce NetworkPolicy; on
# Minikube, start with --cni=calico (or cilium) to have them enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-services-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [triage-service, clinical-assistant-service]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: local-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: local-db
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [triage-service, clinical-assistant-service]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [triage-service, clinical-assistant-service]
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
