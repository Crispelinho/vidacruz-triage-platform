# Images are built from this repository and loaded with `minikube image load`; imagePullPolicy: Never keeps them local.
# Probes use the actuator paths that the security filter treats as public (ApiKeyAuthenticationFilter.java:36-37).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z triage-db 5432 && nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: triage-service
          image: vidacruz/triage-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: triage-local-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 12
          resources:
            requests:
              cpu: 128m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
spec:
  selector:
    app: triage-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-assistant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinical-assistant-service
  template:
    metadata:
      labels:
        app: clinical-assistant-service
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z assistant-db 5432 && nc -z redis 6379 && nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: clinical-assistant-service
          image: vidacruz/clinical-assistant-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-local-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 12
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clinical-assistant-service
spec:
  selector:
    app: clinical-assistant-service
  ports:
    - name: http
      port: 80
      targetPort: http
