# Disposable development values for a local cluster only. Never reuse them outside this overlay.
apiVersion: v1
kind: Secret
metadata:
  name: local-db-auth
  labels:
    app.kubernetes.io/part-of: vidacruz
type: Opaque
stringData:
  POSTGRES_USER: triage_admin
  POSTGRES_PASSWORD: local-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: triage-service-secrets
  labels:
    app.kubernetes.io/part-of: vidacruz
type: Opaque
stringData:
  TRIAGE_API_KEY: local-triage-key
  TRIAGE_DB_PASSWORD: local-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: clinical-assistant-service-secrets
  labels:
    app.kubernetes.io/part-of: vidacruz
type: Opaque
stringData:
  ASSISTANT_API_KEY: local-assistant-key
  ASSISTANT_DB_PASSWORD: local-dev-password
  # Empty provider keys keep the assistant in degraded mode; no model provider is contacted.
  GEMINI_API_KEY: ""
  OPENCODE_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  labels:
    app.kubernetes.io/part-of: vidacruz
type: Opaque
stringData:
  REDIS_PASSWORD: local-redis-password
