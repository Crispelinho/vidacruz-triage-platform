# Local-only trace collector for the NFR-16 check. It is not part of the Azure deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: vidacruz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: vidacruz
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          # Pinned below 2.23.0 on purpose, same image as docker-compose.yml: 2.21 removed the v1 query API that
          # Grafana 12.1.1 uses. It lacks the 2.21-2.23 hardening; the upgrade condition is written there.
          image: jaegertracing/jaeger:2.20.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            # This image declares no group; without it the process would run in the root group.
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: vidacruz
spec:
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  selector:
    app.kubernetes.io/name: jaeger
