# Demo override: SLA of 1 minute for CRITICO and a monitor round every 5 seconds, to watch the escalation and the
# alert without waiting 5 minutes. Use it on top of the main file:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
services:
  triage-service:
    environment:
      SLA_CRITICO_MINUTES: 1
      TRIAGE_SLA_EVALUATION_INTERVAL_MS: 5000
