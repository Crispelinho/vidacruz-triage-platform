# Shape of the triage-service secret. It is NOT part of the kustomization and never holds real values:
# infra/azure/deploy.ps1 creates it from the "azure" GitHub environment.
apiVersion: v1
kind: Secret
metadata:
  name: triage-service-secrets
type: Opaque
stringData:
  # X-API-Key of the triage API, at least 16 characters
  TRIAGE_API_KEY: <api-key>
  # M-2: TRIAGE_API_KEY is the owner key and always keeps every scope. The keys below are optional and additive;
  # only their id is ever logged (PHI read audit).
  # Revocable evaluator key (triage:read + triage:write). Optional: without it only TRIAGE_API_KEY exists.
  # TRIAGE_REVIEWER_API_KEY: <reviewer-key>
  # Extra scoped keys, id|scope,scope|key;... Scopes: triage:read, triage:write, metrics:read.
  # TRIAGE_API_KEYS: dashboard|triage:read|<key-1>;prometheus|metrics:read|<key-2>
  # Password of the PostgreSQL administrator (parameter postgresAdminPassword of main.bicep)
  TRIAGE_DB_PASSWORD: <postgres-password>
