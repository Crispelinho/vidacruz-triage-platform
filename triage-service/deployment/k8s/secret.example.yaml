# Shape of the triage-service secret. It is NOT part of the kustomization and never holds real values:
# infra/azure/deploy.ps1 creates it from the "azure" GitHub environment.
apiVersion: v1
kind: Secret
metadata:
  name: triage-service-secrets
type: Opaque
stringData:
  # X-API-Key of the triage API, at least 16 characters
  TRIAGE_API_KEY: <api-key>
  # Optional scoped keys (M-2). When set, TRIAGE_API_KEY is no longer accepted. Format: id|scope,scope|key;...
  # Scopes: triage:read, triage:write, metrics:read. Only the id is ever logged (PHI read audit).
  # TRIAGE_API_KEYS: dashboard|triage:read|<key-1>;intake|triage:read,triage:write|<key-2>;prometheus|metrics:read|<key-3>
  # Password of the PostgreSQL administrator (parameter postgresAdminPassword of main.bicep)
  TRIAGE_DB_PASSWORD: <postgres-password>
