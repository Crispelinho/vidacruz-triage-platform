spring:
  application:
    name: triage-service
  webflux:
    base-path: /api
  r2dbc:
    url: r2dbc:postgresql://triage-db:5432/vidacruz_triage
    username: triage_app
    password: triage_password
    pool:
      initial-size: 10
      max-size: 20
  kafka:
    bootstrap-servers: kafka:29092
management:
  endpoints:
    web:
      exposure:
        include: health,readiness
app:
  sla:
    defaults:
      CRITICO: 5
      URGENTE: 10
