spring:
  application:
    name: triage-service
  # Observations and trace context must survive Reactor boundaries (NFR-16).
  reactor:
    context-propagation: auto
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidacruz_triage}
    username: ${TRIAGE_DB_USER:triage_app}
    password: ${TRIAGE_DB_PASSWORD:}
    pool:
      initial-size: 2
      max-size: 10
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
logging:
  # Structured JSON logs (ECS) with traceId, spanId and correlationId from the MDC (NFR-20).
  # LOG_FORMAT accepts the Spring Boot formats ecs, logstash or gelf.
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # Fixed buckets let the dashboards compute a p95 per route (NFR-07).
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # W3C traceparent is the Spring Boot default. Span export is enabled only when
  # MANAGEMENT_OTLP_TRACING_ENDPOINT is set (local Jaeger); logs always carry traceId/spanId.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
app:
  sla:
    # Overridable for the local demo so RF-03 escalation can be observed in minutes.
    defaults:
      CRITICO: ${SLA_CRITICO_MINUTES:5}
      URGENTE: ${SLA_URGENTE_MINUTES:10}
      URGENTE_2: ${SLA_URGENTE_2_MINUTES:30}
      NO_URGENTE: ${SLA_NO_URGENTE_MINUTES:60}
      NO_URGENTE_2: ${SLA_NO_URGENTE_2_MINUTES:120}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    topic: ${TRIAGE_EVENTS_TOPIC:triaje.eventos}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:5000}
  idempotency:
    cleanup-enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:false}
    cleanup-interval-ms: ${IDEMPOTENCY_CLEANUP_INTERVAL_MS:3600000}
  report:
    max-range: ${REPORT_MAX_RANGE:P90D}
alerts:
  stream:
    heartbeat: ${ALERTS_HEARTBEAT_INTERVAL:15s}
triage:
  # Required (ADR-07): no default, so a missing TRIAGE_API_KEY stops startup instead of accepting a public key.
  # Docker Compose and the local K8s overlay supply their own local-only values.
  api-key: ${TRIAGE_API_KEY:}
  # M-2: optional scoped keys, "id|scope,scope|key" entries separated by ";". Scopes: triage:read, triage:write,
  # metrics:read. When blank, the single api-key above is accepted with every scope (backward compatible).
  # Example: TRIAGE_API_KEYS="dashboard|triage:read|<key-1>;intake|triage:read,triage:write|<key-2>;prometheus|metrics:read|<key-3>"
  api-keys: ${TRIAGE_API_KEYS:}
  sla:
    evaluation-enabled: ${TRIAGE_SLA_EVALUATION_ENABLED:false}
    evaluation-interval: ${TRIAGE_SLA_EVALUATION_INTERVAL_MS:60000}
