spring:
  application:
    name: triage-service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidacruz_triage}
    username: ${TRIAGE_DB_USER:triage_app}
    password: ${TRIAGE_DB_PASSWORD:}
    pool:
      initial-size: 2
      max-size: 10
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 1
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # Fixed buckets let the dashboards compute a p95 per route (NFR-07).
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  sla:
    # Overridable for the local demo so RF-03 escalation can be observed in minutes.
    defaults:
      CRITICO: ${SLA_CRITICO_MINUTES:5}
      URGENTE: ${SLA_URGENTE_MINUTES:10}
      URGENTE_2: ${SLA_URGENTE_2_MINUTES:30}
      NO_URGENTE: ${SLA_NO_URGENTE_MINUTES:60}
      NO_URGENTE_2: ${SLA_NO_URGENTE_2_MINUTES:120}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    topic: ${TRIAGE_EVENTS_TOPIC:triaje.eventos}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS}
  idempotency:
    cleanup-enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:false}
    cleanup-interval-ms: ${IDEMPOTENCY_CLEANUP_INTERVAL_MS}
  report:
    max-range: ${REPORT_MAX_RANGE:P90D}
alerts:
  stream:
    heartbeat: ${ALERTS_HEARTBEAT_INTERVAL:15s}
triage:
  alerts:
    # RF-06 alert dispatcher. SMS and email are mocks (log only); in-app writes to in_app_notifications.
    enabled: ${TRIAGE_ALERTS_ENABLED:true}
    channels: ${TRIAGE_ALERTS_CHANNELS:sms,email,in-app}
    email-recipient: ${ALERTS_EMAIL_RECIPIENT:notifications@hospital.local}
  # Local/demo default only. Override TRIAGE_API_KEY outside localhost (ADR-07).
  api-key: ${TRIAGE_API_KEY:test-triage-key}
  urgency:
    consumer-enabled: ${TRIAGE_URGENCY_CONSUMER_ENABLED:true}
    consumer-group: ${TRIAGE_URGENCY_CONSUMER_GROUP:triage-urgency-projection}
    topic: ${TRIAGE_EVENTS_TOPIC:triaje.eventos}
    discharged-ttl: ${TRIAGE_URGENCY_DISCHARGED_TTL:PT24H}
  sla:
    evaluation-enabled: ${TRIAGE_SLA_EVALUATION_ENABLED:false}
    evaluation-interval: ${TRIAGE_SLA_EVALUATION_INTERVAL_MS:${TRIAGE_SLA_EVALUATION_INTERVAL:60000}}
