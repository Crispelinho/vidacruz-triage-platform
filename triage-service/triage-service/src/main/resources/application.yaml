spring:
  application:
    name: triage-service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidacruz_triage}
    username: ${TRIAGE_DB_USER:triage_app}
    password: ${TRIAGE_DB_PASSWORD:}
    pool:
      initial-size: 2
      max-size: 10
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  sla:
    # Overridable for the local demo so RF-03 escalation can be observed in minutes.
    defaults:
      CRITICO: ${SLA_CRITICO_MINUTES:5}
      URGENTE: ${SLA_URGENTE_MINUTES:10}
      URGENTE_2: ${SLA_URGENTE_2_MINUTES:30}
      NO_URGENTE: ${SLA_NO_URGENTE_MINUTES:60}
      NO_URGENTE_2: ${SLA_NO_URGENTE_2_MINUTES:120}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    topic: ${TRIAGE_EVENTS_TOPIC:triaje.eventos}
  report:
    max-range: ${REPORT_MAX_RANGE:P90D}
alerts:
  stream:
    heartbeat: ${ALERTS_HEARTBEAT_INTERVAL:15s}
triage:
  sla:
    evaluation-enabled: ${TRIAGE_SLA_EVALUATION_ENABLED:false}
