name: k8s-manifests
on:
  push:
    paths:
      - 'infra/k8s/**'
      - 'triage-service/deployment/k8s/**'
      - 'clinical-assistant-service/deployment/k8s/**'
      - '.github/workflows/k8s-manifests.yml'
  pull_request:
    paths:
      - 'infra/k8s/**'
      - 'triage-service/deployment/k8s/**'
      - 'clinical-assistant-service/deployment/k8s/**'
      - '.github/workflows/k8s-manifests.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Render and validate manifests
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra/k8s infra/k8s/cluster infra/k8s/edge infra/k8s/routes triage-service/deployment/k8s clinical-assistant-service/deployment/k8s; do
            echo "==> validating $dir"
            kustomize build "$dir" > "/tmp/$(echo "$dir" | tr '/\' '_').yaml"
            kubeconform -strict -ignore-missing-schemas -summary "/tmp/$(echo "$dir" | tr '/\' '_').yaml"
          done
