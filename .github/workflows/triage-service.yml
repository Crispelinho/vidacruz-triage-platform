# CI of triage-service: build with every test (Testcontainers runs PostgreSQL and Kafka on the runner) and the image
# used by the deployment.
name: triage-service

on:
  push:
    branches: [main, develop]
    paths:
      - triage-service/**
      - .github/workflows/triage-service.yml
  pull_request:
    paths:
      - triage-service/**
      - .github/workflows/triage-service.yml

permissions:
  contents: read

concurrency:
  group: triage-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            triage-service/triage-service/*.gradle*
            triage-service/triage-service/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        working-directory: triage-service/triage-service
        run: ./gradlew build --no-daemon

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: triage-service-test-reports
          path: triage-service/triage-service/build/reports/tests/
          retention-days: 7

      - name: Build the image
        run: docker build --file triage-service/deployment/Dockerfile --tag triage-service:${{ github.sha }} triage-service/triage-service

      # M-4: SCA on the image that is deployed. Trivy scans the OS packages and the Java libraries inside the Spring
      # Boot jar and reports HIGH or CRITICAL findings (CVSS >= 7) that have a fixed version. REPORT-ONLY by default:
      # the step is marked failed but the job passes. Set the repository variable SCA_BLOCKING=true to make it block.
      # Dependabot (.github/dependabot.yml) proposes the upgrades.
      - name: Scan the image for vulnerabilities
        continue-on-error: ${{ vars.SCA_BLOCKING != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: triage-service:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          version: v0.76.2
