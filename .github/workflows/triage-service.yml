# CI of triage-service: build with every test (Testcontainers runs PostgreSQL and Kafka on the runner) and the image
# used by the deployment.
name: triage-service

on:
  push:
    branches: [main, develop]
    paths:
      - triage-service/**
      - .github/workflows/triage-service.yml
  pull_request:
    paths:
      - triage-service/**
      - .github/workflows/triage-service.yml

permissions:
  contents: read

concurrency:
  group: triage-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            triage-service/triage-service/*.gradle*
            triage-service/triage-service/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        working-directory: triage-service/triage-service
        run: ./gradlew build --no-daemon

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: triage-service-test-reports
          path: triage-service/triage-service/build/reports/tests/
          retention-days: 7

      - name: Build the image
        run: docker build --file triage-service/deployment/Dockerfile --tag triage-service:${{ github.sha }} triage-service/triage-service
