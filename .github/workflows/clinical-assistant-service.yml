# CI of clinical-assistant-service: build with every test (Testcontainers runs Kafka and Redis; the model APIs are
# faked with fixtures, so no key is needed) and the image used by the deployment.
name: clinical-assistant-service

on:
  push:
    branches: [main, develop]
    paths:
      - clinical-assistant-service/**
      - .github/workflows/clinical-assistant-service.yml
  pull_request:
    paths:
      - clinical-assistant-service/**
      - .github/workflows/clinical-assistant-service.yml

permissions:
  contents: read

concurrency:
  group: clinical-assistant-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            clinical-assistant-service/clinical-assistant-service/*.gradle*
            clinical-assistant-service/clinical-assistant-service/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        working-directory: clinical-assistant-service/clinical-assistant-service
        run: ./gradlew build --no-daemon

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clinical-assistant-service-test-reports
          path: clinical-assistant-service/clinical-assistant-service/build/reports/tests/
          retention-days: 7

      - name: Build the image
        run: docker build --file clinical-assistant-service/deployment/Dockerfile --tag clinical-assistant-service:${{ github.sha }} clinical-assistant-service/clinical-assistant-service

      # M-4: SCA on the image that is deployed. Trivy scans the OS packages and the Java libraries inside the Spring
      # Boot jar and reports HIGH or CRITICAL findings (CVSS >= 7) that have a fixed version. REPORT-ONLY by default:
      # the step is marked failed but the job passes. Set the repository variable SCA_BLOCKING=true to make it block.
      # Dependabot (.github/dependabot.yml) proposes the upgrades.
      - name: Scan the image for vulnerabilities
        continue-on-error: ${{ vars.SCA_BLOCKING != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clinical-assistant-service:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          version: v0.76.2
