# Real-provider chat gates against OpenRouter, started by hand. OPENROUTER_API_KEY lives only in the environment
# "openrouter-verification" (not as a repository secret), so a job can read it only after the environment's protection
# rules pass: deployment branches develop/main and its required reviewers (docs/operations/despliegue-azure-y-pruebas.md).
# The job-level `if` is defence in depth for the same branch rule. Actions are pinned to full commit SHAs.
name: OpenRouter chat verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tst-rag:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: openrouter-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: clinical-assistant-service/clinical-assistant-service/gradle/wrapper/gradle-wrapper.properties

      - name: Require the OpenRouter Secret
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Run real-provider chat gates
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
        working-directory: clinical-assistant-service/clinical-assistant-service
        run: ./gradlew test --no-daemon --tests 'com.vidacruz.clinical.integration.OpenRouterChatVerificationTest'

      - name: Upload chat verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrouter-chat-verification
          path: clinical-assistant-service/clinical-assistant-service/build/reports/openrouter-chat-verification/results.json
          if-no-files-found: warn
