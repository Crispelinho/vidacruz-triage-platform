# Shape of the clinical-assistant-service secret. It is NOT part of the kustomization and never holds real values:
# infra/azure/deploy.ps1 creates it from the "azure" GitHub environment.
apiVersion: v1
kind: Secret
metadata:
  name: clinical-assistant-service-secrets
type: Opaque
stringData:
  # X-API-Key of the assistant API, at least 16 characters
  ASSISTANT_API_KEY: <api-key>
  # Optional scoped keys (M-2). When set, ASSISTANT_API_KEY is no longer accepted. Format: id|scope,scope|key;...
  # Scopes: assistant:query, corpus:admin, metrics:read. Give corpus:admin only to the corpus curator.
  # ASSISTANT_API_KEYS: frontend|assistant:query|<key-1>;curator|corpus:admin|<key-2>;prometheus|metrics:read|<key-3>
  # Password of the PostgreSQL administrator (parameter postgresAdminPassword of main.bicep)
  ASSISTANT_DB_PASSWORD: <postgres-password>
  # Empty provider keys run the assistant in degraded mode (503 for questions that need the model)
  GEMINI_API_KEY: <gemini-api-key>
  OPENCODE_API_KEY: <opencode-api-key>
